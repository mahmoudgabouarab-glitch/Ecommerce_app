name: ecommerce_app
description: "E-Commerce App — a full-stack shopping app (Flutter + Laravel)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  dartz: ^0.10.1

  get_it: ^8.0.3

  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1

  flutter_screenutil: ^5.9.3

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  share_plus: ^10.1.4

  fl_chart: ^0.69.2

  intl: ^0.20.2
  easy_localization: ^3.0.7

  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
