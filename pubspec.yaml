name: ecommerce_app
description: "E-Commerce App — a full-stack shopping app (Flutter + Laravel)."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (BLoC / Cubit)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Functional error handling
  dartz: ^0.10.1

  # Dependency injection (Service Locator)
  get_it: ^8.0.3

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local storage (token / cache)
  shared_preferences: ^2.3.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Images & loading placeholders
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Pick/capture profile photo
  image_picker: ^1.1.2

  # Share products
  share_plus: ^10.1.4

  # Charts (admin analytics)
  fl_chart: ^0.69.2

  # Utils
  intl: ^0.20.2

  # Localization (Arabic + English)
  easy_localization: ^3.0.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/

